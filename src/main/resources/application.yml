server:
  port: 8099
  servlet:
    context-path: /

spring:
  application:
    name: checkin-system
  config:
    # 本地/正式机的真实配置放在 application-local.yml（已加入 .gitignore，不提交）
    import: optional:classpath:application-local.yml
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/checkin_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change-me}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      table-underline: true

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-string}
  expire-hours: 12

checkin:
  time-windows:
    morning-start: "06:00"
    morning-end: "07:10"
    evening-start: "21:30"
    evening-end: "21:50"

logging:
  level:
    root: info
    com.school.checkin: info
    com.baomidou: warn
    org.mybatis: warn
    java.sql: warn
